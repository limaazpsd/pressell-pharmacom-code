  <style>
    :root {
      --bg-image: url('../bg-produtos.png');
      --bg-blur-amount: 9px;
      --overlay-bg: rgba(6, 9, 14, 0.82);
      --overlay-vignette: radial-gradient(circle at 50% 45%, rgba(13, 19, 28, 0.65) 0%, rgba(4, 6, 9, 0.94) 100%);
      --color-accent: #00c0f3;
      --color-accent-glow: rgba(0, 192, 243, 0.45);
      --color-text-dim: #94a3b8;
      --color-text-bright: #f8fafc;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background: #090c10;
      font-family: 'Sora', 'Inter', sans-serif;
      color: var(--color-text-bright);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .bg-layer {
      position: fixed;
      inset: -25px;
      background: var(--bg-image) center top / cover no-repeat;
      filter: blur(var(--bg-blur-amount)) brightness(0.72) saturate(1.15);
      transform: scale(1.04);
      z-index: 1;
      will-change: transform, filter;
      pointer-events: none;
    }

    .overlay-layer {
      position: fixed;
      inset: 0;
      background: var(--overlay-vignette);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 14px 12px 14px;
    }

    .top-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(0, 192, 243, 0.12);
      border: 1px solid rgba(0, 192, 243, 0.3);
      padding: 4px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      z-index: 10;
      margin-top: 4px;
      text-align: center;
    }

    .modal-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-container {
      position: relative;
      max-width: 680px;
      width: 92%;
      background: #0d121c;
      border-radius: 18px;
      overflow: visible;
      box-shadow: 
        0 25px 60px -12px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 35px var(--color-accent-glow);
      animation: modalEntrance 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .modal-container:hover {
      transform: translateY(-2px) scale(1.008);
      box-shadow: 
        0 30px 70px -10px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(0, 192, 243, 0.4),
        0 0 45px var(--color-accent-glow);
    }

    @keyframes modalEntrance {
      0% { opacity: 0; transform: scale(0.92) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-banner {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      cursor: pointer;
    }

    .close-button-wrapper {
      position: absolute;
      top: -16px;
      right: -16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s ease;
    }

    .close-button-wrapper:hover {
      background: #00c0f3;
      border-color: #ffffff;
      transform: scale(1.12) rotate(90deg);
      box-shadow: 0 0 20px rgba(0, 192, 243, 0.8);
    }

    .close-button-wrapper svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .compliance-footer {
      width: 100%;
      max-width: 980px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-dim);
      z-index: 10;
      padding-top: 6px;
      line-height: 1.6;
    }

    .compliance-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .compliance-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .compliance-link:hover { color: #00c0f3; text-decoration: underline; }
    .compliance-copy { opacity: 0.65; font-size: 10px; margin-top: 2px; }

    @media (max-width: 680px) {
      .modal-container { width: 94%; border-radius: 14px; }
      .modal-banner { border-radius: 14px; }
      .close-button-wrapper { top: -12px; right: -12px; width: 38px; height: 38px; }
      .close-button-wrapper svg { width: 15px; height: 15px; }
      .compliance-footer { font-size: 10px; padding-bottom: 4px; }
      .compliance-links { gap: 8px 12px; }

  <script>
    (function () {
      'use strict';

      var TARGET_BASE = 'https://pharmacomoficial.com/';
      var hasRedirected = false;

      function buildFinalUrl(baseUrl) {
        var url = baseUrl || TARGET_BASE;
        var query = window.location.search;
        if (!query) return url;

        var cleanQuery = query.startsWith('?') ? query.substring(1) : query;
        return url + (url.indexOf('?') !== -1 ? '&' : '?') + cleanQuery;
      }

      function triggerRedirect(destinationUrl) {
        if (hasRedirected) return;
        hasRedirected = true;

        var finalTarget = destinationUrl ? buildFinalUrl(destinationUrl) : buildFinalUrl(TARGET_BASE);

        try {
          if (typeof window.gtag === 'function') {
            window.gtag('event', 'presell_action_click', {
              'event_category': 'Engagement',
              'event_label': 'Product Page Redirect',
              'transport_type': 'beacon'
            });
            window.gtag('event', 'conversion', {
              'send_to': 'AW-18258552622'
            });
          }
        } catch (err) {
          console.warn('Tag event err:', err);
        }

        setTimeout(function () {
          window.location.href = finalTarget;
        }, 120);
      }

      var closeBtn = document.getElementById('btn-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          triggerRedirect();
        });
      }

      var modalCard = document.getElementById('modal-card');
      if (modalCard) {
        modalCard.addEventListener('click', function (e) {
          if (!e.target.closest('#btn-close')) {
            e.preventDefault();
            e.stopPropagation();
            triggerRedirect();
          }
        });
      }

      var globalOverlay = document.getElementById('global-overlay');
      if (globalOverlay) {
        globalOverlay.addEventListener('click', function (e) {
          if (e.target.closest('#compliance-footer')) {
            return;
          }
          e.preventDefault();
          triggerRedirect();
        });
      }

    })();
  </script>
