  <!-- Redirecionamento Universal com repasse de UTMs -->
  <script>
    (function () {
      'use strict';

      var TARGET_BASE = 'https://pharmacomoficial.com/';
      var hasRedirected = false;

      function buildFinalUrl(baseUrl) {
        var url = baseUrl || TARGET_BASE;
        var query = window.location.search;
        if (!query) return url;

        var cleanQuery = query.startsWith('?') ? query.substring(1) : query;
        return url + (url.indexOf('?') !== -1 ? '&' : '?') + cleanQuery;
      }

      function triggerRedirect() {
        if (hasRedirected) return;
        hasRedirected = true;

        var finalTarget = buildFinalUrl(TARGET_BASE);

        try {
          if (typeof window.gtag === 'function') {
            window.gtag('event', 'presell_action_click', {
              'event_category': 'Engagement',
              'event_label': 'Lead Presell Redirect',
              'transport_type': 'beacon'
            });
            window.gtag('event', 'conversion', {
              'send_to': 'AW-18258552622'
            });
          }
        } catch (err) {}

        setTimeout(function () {
          window.location.href = finalTarget;
        }, 120);
      }

      // Clique no botão de fechar
      var closeBtn = document.getElementById('popup-close-btn');
      if (closeBtn) {
        closeBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          triggerRedirect();
        });
      }

      // Clique no banner
      var bannerImg = document.getElementById('popup-banner-img');
      if (bannerImg) {
        bannerImg.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          triggerRedirect();
        });
      }

      // Clique no fundo escuro
      var popup = document.getElementById('poppromotimer');
      if (popup) {
        popup.addEventListener('click', function (e) {
          if (e.target.closest('#discreet-footer')) return;
          e.preventDefault();
          triggerRedirect();
        });
      }

    })();
  </script>
